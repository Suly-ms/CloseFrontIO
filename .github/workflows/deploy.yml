name: 🚀 Deploy

on:
  # Allow contributors to schedule manual deployments.
  # Permission to deploy can be restricted by requiring approval in environment configuration.
  workflow_dispatch:
    inputs:
      target_domain:
        description: "Deployment Domain"
        required: true
        default: "closefront.dev"
        type: choice
        options:
          - closefront.io
          - closefront.dev
      target_host:
        description: "Deployment Host"
        required: true
        default: "staging"
        type: choice
        options:
          - masters
          - staging
          - staging2
          - falk2
      target_subdomain:
        description: "Deployment Subdomain"
        required: false
        default: ""
        type: string
      # A fleet member on a second machine needs a name of its own
      # (blue.staging2.server.closefront.dev): the registry keys letters by
      # host, so two boxes answering as blue.server.closefront.dev would share
      # one. Empty is <subdomain>.<game domain>.
      game_host:
        description: "Game host (only for a machine-scoped fleet member)"
        required: false
        default: ""
        type: string

  # Pushes to main deploy to the configured production server.
  # See https://docs.github.com/en/actions/writing-workflows/workflow-syntax-for-github-actions#onpushpull_requestpull_request_targetpathspaths-ignore
  push:
    branches:
      - main

  # Nightly build: rebuild and deploy main to nightly/green/blue .closefront.dev
  # 07:00 UTC = 11:00 PM PST (midnight PDT during summer)
  schedule:
    - cron: "0 7 * * *"

permissions: {}

# Serialize production pushes, the nightly, and manual deploys independently.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.target_host || github.event_name == 'schedule' && 'staging-nightly' || github.event_name == 'push' && 'production' || 'staging-manual' }}
  cancel-in-progress: false

jobs:
  deploy:
    # Forks can deploy main to their own prod environment. Scheduled and
    # manually dispatched fleet deploys remain restricted to the official repo.
    if: ${{ github.repository == 'closefrontio/CloseFrontIO' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    # Use different logic based on event type
    name: Deploy to ${{ inputs.target_domain || vars.PRODUCTION_DOMAIN || 'closefront.dev' }}${{ matrix.subdomain && format(' ({0} on {1})', matrix.subdomain, matrix.host) }}
    runs-on: ubuntu-latest
    # The schedule fans out to nightly and the dev fleet, one leg per entry
    # of the DEPLOY_TARGETS_DEV REPOSITORY var (repository-level because
    # GitHub expands strategy.matrix before a job's environment exists).
    # Same shape as release.yml's DEPLOY_TARGETS_*: host is the machine
    # deploy.sh resolves through SERVER_HOSTS_JSON, subdomain the slot;
    # gameHost (blue.<machine>.server.closefront.dev) puts the machine in the
    # name, and site overrides the default, which already puts the blue and
    # green slots on the apex. Defaults to today's single box. Every other event deploys a single subdomain,
    # expressed as a one-element matrix with an empty string so RAW_SUBDOMAIN
    # and HOST below fall through to the per-event logic.
    strategy:
      fail-fast: false
      # One leg at a time: parallel legs would race concurrent pushes of the
      # shared :latest/:buildcache tags (build.sh tags both on every build)
      # and pile every deploy onto deploy.sh's 15-minute host-side flock.
      # Sequential legs have one writer at a time and no lock contention, and
      # later legs rebuild from the registry cache leg 1 just pushed, so they
      # are cheap.
      max-parallel: 1
      matrix:
        include: ${{ github.event_name == 'schedule' && fromJSON(vars.DEPLOY_TARGETS_DEV || '[{"subdomain":"nightly","host":"staging"},{"subdomain":"green","host":"staging"},{"subdomain":"blue","host":"staging"}]') || fromJSON('[{"subdomain":""}]') }}
    timeout-minutes: 30
    # The workflow token publishes the image and update.sh pulls it on the server.
    permissions:
      contents: read
      id-token: write
      packages: write
    environment: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && 'prod' || (inputs.target_domain == 'closefront.io' && 'prod' || '') }}
    env:
      DOMAIN: ${{ github.event_name == 'push' && vars.PRODUCTION_DOMAIN || inputs.target_domain || 'closefront.dev' }}
      # Sanitized into SUBDOMAIN by the first step below - do not use directly.
      RAW_SUBDOMAIN: ${{ matrix.subdomain || (github.event_name == 'push' && vars.PRODUCTION_SUBDOMAIN) || (github.event_name == 'push' && github.ref_name) || inputs.target_subdomain || 'main' }}
    steps:
      - name: 🔧 Validate production settings
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          PRODUCTION_DOMAIN: ${{ vars.PRODUCTION_DOMAIN }}
          PRODUCTION_HOST: ${{ vars.PRODUCTION_HOST }}
          PRODUCTION_SUBDOMAIN: ${{ vars.PRODUCTION_SUBDOMAIN }}
          GHCR_USERNAME: ${{ vars.GHCR_USERNAME }}
          GHCR_REPO: ${{ vars.GHCR_REPO }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_AUDIENCE: ${{ secrets.TS_AUDIENCE }}
          PRODUCTION_TAILSCALE_IP: ${{ vars.PRODUCTION_TAILSCALE_IP }}
          PRODUCTION_GAME_PORT: ${{ vars.PRODUCTION_GAME_PORT || '8080' }}
        run: |
          set -euo pipefail
          : "${PRODUCTION_DOMAIN:?Set PRODUCTION_DOMAIN in the GitHub prod environment}"
          : "${PRODUCTION_HOST:?Set PRODUCTION_HOST in the GitHub prod environment}"
          : "${PRODUCTION_SUBDOMAIN:?Set PRODUCTION_SUBDOMAIN in the GitHub prod environment}"
          : "${GHCR_USERNAME:?Set GHCR_USERNAME in GitHub variables}"
          : "${GHCR_REPO:?Set GHCR_REPO in GitHub variables}"
          : "${SSH_PRIVATE_KEY:?Set SSH_PRIVATE_KEY in GitHub secrets}"
          : "${TS_OAUTH_CLIENT_ID:?Set TS_OAUTH_CLIENT_ID in GitHub secrets}"
          : "${TS_AUDIENCE:?Set TS_AUDIENCE in GitHub secrets}"
          : "${PRODUCTION_TAILSCALE_IP:?Set PRODUCTION_TAILSCALE_IP in GitHub variables}"
          : "${PRODUCTION_GAME_PORT:?Set PRODUCTION_GAME_PORT in GitHub variables}"
          if [[ ! "$PRODUCTION_TAILSCALE_IP" =~ ^100\. ]]; then
            echo "PRODUCTION_TAILSCALE_IP must be the server's Tailscale IPv4 address"
            exit 1
          fi
          if [[ ! "$PRODUCTION_GAME_PORT" =~ ^[0-9]+$ ]] || \
            (( 10#$PRODUCTION_GAME_PORT < 1 || 10#$PRODUCTION_GAME_PORT > 65535 )); then
            echo "PRODUCTION_GAME_PORT must be an integer between 1 and 65535"
            exit 1
          fi
      # Runs in every leg because the matrix is expanded from this same var
      # before any step exists; with a bad var each leg stops here, so nothing
      # deploys. JSON that does not parse fails the matrix expansion itself.
      - name: 🔍 Validate deploy targets
        if: ${{ github.event_name == 'schedule' && vars.DEPLOY_TARGETS_DEV != '' }}
        env:
          DEPLOY_TARGETS_DEV: ${{ vars.DEPLOY_TARGETS_DEV }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$DEPLOY_TARGETS_DEV" | jq -e '
            type == "array" and length > 0 and all(.[];
              type == "object"
              and (.host | type == "string")
              and (.subdomain | type == "string")
              and (if has("gameHost") then .gameHost | type == "string" else true end)
              and (if has("site") then .site | type == "string" else true end))' > /dev/null; then
            echo "Error: repository var DEPLOY_TARGETS_DEV must be a non-empty JSON array of {host, subdomain[, gameHost, site]} objects, got: ${DEPLOY_TARGETS_DEV}"
            exit 1
          fi
      - uses: actions/checkout@v7
      - name: 📝 Update job summary
        run: |
          # A branch name can hold characters that are illegal in a DNS label, a
          # Docker container name, and a file path (e.g. "fix/some-bug"), so
          # normalize it to an RFC 1123 label first: lowercased, because
          # browsers lowercase the host and the API only accepts a lowercase
          # site; underscores and slashes become hyphens to keep the name
          # readable (Fix/some-bug -> fix-some-bug); anything else outside
          # [a-z0-9-] is dropped; and the result is capped at the 63-octet label
          # limit with no edge hyphens.
          READABLE="$(printf '%s' "$RAW_SUBDOMAIN" | tr '[:upper:]' '[:lower:]' | tr '_/' '--')"
          LABEL="$(printf '%s' "$READABLE" | tr -cd 'a-z0-9-')"
          LABEL="$(printf '%s' "${LABEL:0:63}" | sed 's/^-*//; s/-*$//')"
          if [ -z "$LABEL" ]; then
            echo "Error: subdomain is empty after sanitizing '$RAW_SUBDOMAIN'"
            exit 1
          fi
          # The case and hyphen mappings above are deliberately canonical:
          # Fix/foo and fix-foo share a subdomain, as they would in DNS anyway.
          # But dropping or trimming characters is lossy in ways that aren't
          # obvious from the branch name (feat/héllo and feat/hllo would
          # collide), so whenever sanitizing went beyond those mappings,
          # append a digest of the original to keep such branches on distinct
          # hosts. Names already in canonical form (main, nightly, a hand-typed
          # prod subdomain) pass through unchanged, which update.sh relies on
          # for its `SUBDOMAIN = main` restart check.
          if [ "$LABEL" != "$READABLE" ]; then
            HASH="$(printf '%s' "$RAW_SUBDOMAIN" | sha256sum | cut -c1-6)"
            LABEL="$(printf '%s' "${LABEL:0:56}" | sed 's/-*$//')-${HASH}"
          fi
          SUBDOMAIN="$LABEL"
          FQDN="$SUBDOMAIN.$DOMAIN"
          echo "SUBDOMAIN=$SUBDOMAIN" >> $GITHUB_ENV
          echo "FQDN=$FQDN" >> $GITHUB_ENV
          cat <<EOF >> $GITHUB_STEP_SUMMARY
          ### In progress :ship:

          Deploying from $GITHUB_REF to $FQDN
          EOF
      - uses: actions/create-github-app-token@v3
        id: generate-token
        if: ${{ github.repository == 'closefrontio/CloseFrontIO' }}
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - name: Export the token
        if: ${{ github.repository == 'closefrontio/CloseFrontIO' }}
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          echo "GH_TOKEN=$GH_TOKEN" >> $GITHUB_ENV
          gh api octocat
      # The optional security module (src/server/README.md), at the commit
      # pinned in this tree. The app token is scoped to that repo, read only.
      - uses: actions/create-github-app-token@v3
        id: gatekeeper-token
        if: ${{ github.repository == 'closefrontio/CloseFrontIO' }}
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: closefrontio
          repositories: gatekeeper
          permission-contents: read
      - name: 🔒 Resolve the pinned security module
        id: gatekeeper
        if: ${{ github.repository == 'closefrontio/CloseFrontIO' }}
        run: echo "sha=$(git rev-parse HEAD:src/server/gatekeeper)" >> "$GITHUB_OUTPUT"
      - name: 🔒 Check out the security module
        uses: actions/checkout@v7
        if: ${{ github.repository == 'closefrontio/CloseFrontIO' }}
        with:
          repository: closefrontio/gatekeeper
          ref: ${{ steps.gatekeeper.outputs.sha }}
          path: src/server/gatekeeper
          token: ${{ steps.gatekeeper-token.outputs.token }}
          persist-credentials: false
      - name: 📝 Create deployment
        if: ${{ github.repository == 'closefrontio/CloseFrontIO' && steps.generate-token.outputs.token != '' }}
        uses: actions/github-script@v9
        id: deployment
        env:
          ENVIRONMENT: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && 'prod' || (inputs.target_domain == 'closefront.io' && 'prod' || 'staging') }}
          FQDN: ${{ env.FQDN }}
        with:
          github-token: ${{ steps.generate-token.outputs.token }}
          script: |
            const response = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: process.env.GITHUB_SHA,
              environment: process.env.ENVIRONMENT,
              description: 'Deployment to ' + process.env.FQDN,
              auto_merge: false,
              required_contexts: [],
              transient_environment: process.env.ENVIRONMENT === 'staging' && context.ref !== 'refs/heads/main',
              production_environment: process.env.ENVIRONMENT === 'prod'
            });
            const deployment = response.data;
            if (!deployment || !deployment.id) {
              core.setFailed('Failed to create deployment');
              return;
            }
            core.setOutput('deployment_id', deployment.id);
      - name: 🔗 Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: 🔐 Join Tailscale for production deploy
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:github-actions
          ping: ${{ vars.PRODUCTION_TAILSCALE_IP }}
      # deploy.sh keyscans the target it resolves, so this step only
      # installs the key.
      - name: 🔑 Create SSH private key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euxo pipefail
          mkdir -p ~/.ssh
          echo "${SSH_PRIVATE_KEY}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
      - name: 🚢 Deploy
        env:
          GHCR_REPO: ${{ vars.GHCR_REPO }}
          GHCR_USERNAME: ${{ vars.GHCR_USERNAME }}
          # update.sh pulls the private image with this job's own token.
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
          ENV: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main' && 'prod') || (inputs.target_domain == 'closefront.io' && 'prod') || 'staging' }}
          STANDALONE_MODE: ${{ github.event_name == 'push' && 'true' || '' }}
          # The schedule names a machine per leg; a dispatch picks one; main
          # uses the production host configured in the prod environment.
          HOST: ${{ matrix.host || (github.event_name == 'push' && vars.PRODUCTION_HOST) || (github.event_name == 'workflow_dispatch' && inputs.target_host) || 'staging' }}
          SERVER_HOST_PROD: ${{ vars.PRODUCTION_TAILSCALE_IP }}
          GAME_BIND_IP: ${{ github.event_name == 'push' && vars.PRODUCTION_TAILSCALE_IP || '' }}
          GAME_PORT: ${{ github.event_name == 'push' && (vars.PRODUCTION_GAME_PORT || '8080') || '' }}
          INSTANCE_LETTER: ${{ github.event_name == 'push' && 'a' || '' }}
          NUM_WORKERS: ${{ github.event_name == 'push' && '1' || '' }}
          API_KEY: ${{ github.event_name != 'push' && secrets.API_KEY || '' }}
          TURNSTILE_SITE_KEY: ${{ github.event_name != 'push' && vars.TURNSTILE_SITE_KEY || '' }}
          CDN_BASE: ${{ github.event_name != 'push' && vars.CDN_BASE || '' }}
          # Runtime env for the game server, which injects it into the
          # page's BOOTSTRAP_CONFIG exactly like TURNSTILE_SITE_KEY — builds
          # are environment-agnostic. Repo-level var holds the test-mode
          # key; the `prod` environment (attached above for prod dispatches
          # only) overrides it with the live-mode one — the key's mode must
          # match the mode the API mints intents in (a mismatch is caught by
          # the guard in StripeInline.ts, which just disables the inline
          # flow). Unset/empty also keeps the inline payment flow off (the
          # store falls back to redirect checkout).
          STRIPE_PUBLISHABLE_KEY: ${{ github.event_name != 'push' && vars.STRIPE_PUBLISHABLE_KEY || '' }}
          ADMIN_BOT_API_KEY: ${{ secrets.ADMIN_BOT_API_KEY }}
          # For the optional security module (src/server/gatekeeper). Unset
          # leaves the parts that need it off.
          GATEKEEPER_SECRET: ${{ secrets.GATEKEEPER_SECRET }}
          # From the DEPLOY_TARGETS_DEV entry on the schedule; empty otherwise,
          # and deploy.sh fills in the defaults (deploy.sh, "identity").
          GAME_HOST: ${{ matrix.gameHost || inputs.game_host || '' }}
          SITE_HOST: ${{ matrix.site || (github.event_name == 'push' && vars.PRODUCTION_SITE_HOST) || '' }}
          # Separate domain for GAME hostnames, so the static Worker can own
          # the page host (docs/MultiServer.md, "Two hostnames per
          # deployment"). Unset is today's behaviour. Empty for a prod
          # dispatch, mirroring the ENV gating above and the guard in
          # deploy.sh: it is a repo-level variable prod must never inherit.
          # The value has to sit in the && branch -- `cond && '' || vars.X`
          # would yield vars.X for EVERY run, because '' is falsy here and
          # these are value operators, not a ternary.
          GAME_DOMAIN: ${{ github.event_name != 'push' && inputs.target_domain != 'closefront.io' && vars.GAME_DOMAIN || '' }}
          # "api" joins the site's shared public-lobby roster (infra
          # docs/lobby-coordinator.md); anything else keeps per-server
          # scheduling. Read from the repo-level var here (staging jobs have
          # no environment); the prod environments override it with "off"
          # until prod is ready, since an environment var wins over a repo
          # var of the same name.
          LOBBY_COORDINATOR: ${{ vars.LOBBY_COORDINATOR }}
          SERVER_HOST_MASTERS: ${{ secrets.SERVER_HOST_MASTERS }}
          SERVER_HOST_FALK2: ${{ secrets.SERVER_HOST_FALK2 }}
          SERVER_HOST_STAGING: ${{ secrets.SERVER_HOST_STAGING }}
          SERVER_HOSTS_JSON: ${{ github.event_name != 'push' && secrets.SERVER_HOSTS_JSON || '' }}
          SSH_KEY: ~/.ssh/id_rsa
          VERSION_TAG: latest
        run: |
          echo "::group::deploy.sh"
          ./build-deploy.sh "$ENV" "$HOST" "$SUBDOMAIN"
          echo "Deployment created in ${SECONDS} seconds" >> $GITHUB_STEP_SUMMARY
          echo "::endgroup::"
      - name: ⏳ Wait for deployment to start
        env:
          API_KEY: ${{ github.event_name != 'push' && secrets.API_KEY || '' }}
          # DOMAIN and SUBDOMAIN are already job-level env. Empty for a prod
          # dispatch, mirroring the ENV gating above and the guard in
          # deploy.sh — prod discards GAME_DOMAIN, so polling a game host
          # built from it would wait out 300s on a name that does not exist
          # and fail a deploy that actually succeeded. Same shape as the
          # deploy step above: the value must be in the && branch, since ''
          # is falsy and would fall straight through a trailing ||.
          GAME_DOMAIN: ${{ github.event_name != 'push' && inputs.target_domain != 'closefront.io' && vars.GAME_DOMAIN || '' }}
        run: |
          echo "::group::Wait for deployment to start"
          set -euxo pipefail
          # Poll the GAME host: with GAME_DOMAIN set the page host is served
          # by the static Worker, which knows nothing about this container's
          # commit. Unset, the two are the same name (docs/MultiServer.md).
          # deploy.sh exports GAME_HOST once it has resolved the name from
          # the cluster map — a machine-scoped host cannot be recomputed
          # here; the fallback covers a run that never reached that step.
          GAME_FQDN="${GAME_HOST:-${SUBDOMAIN}.${GAME_DOMAIN:-$DOMAIN}}"
          CURL_ARGS=(-fsS)
          if [ -n "${API_KEY:-}" ]; then
            CURL_ARGS+=(-H "X-API-Key: ${API_KEY}")
          fi
          while [ "$(curl "${CURL_ARGS[@]}" "https://${GAME_FQDN}/commit.txt" || true)" != "${GITHUB_SHA}" ]; do
            if [ "$SECONDS" -ge 300 ]; then
              echo "Timeout: deployment did not start within 5 minutes"
              exit 1
            fi
            sleep 10
          done
          echo "Deployment started in ${SECONDS} seconds" >> $GITHUB_STEP_SUMMARY
          echo "::endgroup::"
      - name: 🔄 Update deployment status
        if: ${{ always() && github.repository == 'closefrontio/CloseFrontIO' && steps.generate-token.outputs.token != '' && steps.deployment.outcome == 'success' && steps.deployment.outputs.deployment_id != '' }}
        uses: actions/github-script@v9
        env:
          FQDN: ${{ env.FQDN }}
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.deployment_id }}
          STATUS: ${{ job.status }}
        with:
          github-token: ${{ steps.generate-token.outputs.token }}
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: process.env.DEPLOYMENT_ID,
              state: process.env.STATUS === 'success' ? 'success' : 'failure',
              environment_url: 'https://' + process.env.FQDN
            });
      - name: ✅ Update job summary
        if: success()
        run: |
          cat <<EOF >> $GITHUB_STEP_SUMMARY
          ### Success! :rocket:

          Deployed from $GITHUB_REF to $FQDN
          EOF
      - name: ❌ Update job summary
        if: failure()
        run: |
          cat <<EOF >> $GITHUB_STEP_SUMMARY
          ### Failure! :fire:

          Unable to deploy from $GITHUB_REF to $FQDN
          EOF
